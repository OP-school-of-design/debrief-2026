# Builds the site on every push to main and uploads it to SiteGround (FTPS).
#
# Security notes:
# - Every action is pinned to an exact commit (the long code after @), so a hijacked tag can't swap in
#   different code. Dependabot (.github/dependabot.yml) proposes updates; check them before merging.
# - The workflow can only READ the repo (permissions below).
# - npm install scripts are switched off (--ignore-scripts): a malicious package can't run code
#   during install. The build doesn't need them.
# - FTPS checks the server's certificate (security: strict), so the password can only be sent to the
#   real server. See README "Deploying" if the first run reports a certificate name mismatch.
# - The deploy tool keeps a list of every uploaded file on the server. SiteGround's NGINX Direct
#   Delivery serves .json files without reading .htaccess, so the list is given a secret, unguessable
#   name (repository secret FTP_STATE_NAME) instead of the well-known default.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two uploads at once; a newer push waits for the current one to finish.
concurrency:
  group: deploy-siteground
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Re-use the WebP images made by earlier builds, so only new or changed images are processed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _site/img
          key: webp-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.webp', 'eleventy.config.js') }}
          restore-keys: webp-

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
        env:
          # Repository variable SITE_BASE, e.g. /debrief/2026/  (leave unset if the site is at the domain root)
          SITE_BASE: ${{ vars.SITE_BASE || '/' }}

      - name: Deploy to SiteGround (FTPS)
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          state-name: ${{ secrets.FTP_STATE_NAME || '.ftp-deploy-sync-state.json' }}
          local-dir: ./_site/
          server-dir: ${{ vars.FTP_SERVER_DIR }}   # e.g. /public_html/debrief/2026/
