# Builds the site on every push to main. Deploying to SiteGround is OFF until you switch it on
# (see README "Going live"). Until then this just proves the site builds.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Re-use processed images between builds (makes most builds take seconds, not minutes)
      - uses: actions/cache@v4
        with:
          path: .cache
          key: eleventy-img-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png') }}
          restore-keys: eleventy-img-

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Repository variable SITE_BASE, e.g. /debrief/2026/  (leave unset if the site is at the domain root)
          SITE_BASE: ${{ vars.SITE_BASE || '/' }}

      - name: Deploy to SiteGround (FTPS)
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ${{ vars.FTP_SERVER_DIR }}   # e.g. /public_html/debrief/2026/
